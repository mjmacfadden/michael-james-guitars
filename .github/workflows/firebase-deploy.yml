# PREPARED, NOT ACTIVE: manual dispatch only, and the job is hard-disabled until reviewed.
# Requires (not yet created): a least-privilege deploy identity via Workload Identity Federation
# (repo variables GCP_WIF_PROVIDER, GCP_DEPLOY_SA). No JSON keys. No secrets stored here.
name: Firebase deploy (manual, disabled)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "hosting | functions | both"
        required: true
        default: hosting
permissions:
  contents: read
  id-token: write
concurrency: { group: firebase-deploy, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint && npm --prefix functions test && npm --prefix functions run catalog:check
      - run: npm audit --omit=dev --prefix functions
  deploy:
    needs: test
    if: ${{ false }} # remove only after review + E2E test verification
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --prefix functions && node scripts/stage-public.mjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: |
          case "${{ inputs.target }}" in
            hosting) ONLY=hosting ;; functions) ONLY=functions ;; both) ONLY=hosting,functions ;; *) exit 1 ;;
          esac
          npx -y firebase-tools@latest deploy --project michael-james-guitars --only "$ONLY" --non-interactive
