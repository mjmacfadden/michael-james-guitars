# DISABLED: Functions / combined deploy is intentionally off.
# Live website Hosting auto-publishes via firebase-hosting-live.yml on push to main.
# Do not enable this file for Functions/Firestore/Secret Manager without a separate review.
name: Firebase deploy (manual, disabled)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "hosting | functions | both — job stays disabled"
        required: true
        default: hosting
permissions:
  contents: read
  id-token: write
concurrency: { group: firebase-deploy, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint && npm --prefix functions test && npm --prefix functions run catalog:check
  deploy:
    needs: test
    if: ${{ false }} # Hosting live uses firebase-hosting-live.yml; keep Functions off
    runs-on: ubuntu-latest
    steps:
      - run: echo "disabled"
